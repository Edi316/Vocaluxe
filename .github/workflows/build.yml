name: 'Vocaluxe Custom Build FFmpeg'

on:
  push:
    tags:
      - '[0-9].[0-9].[0-9]'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    env:
      # 'latest' takes the newest 8.1.x build; set an autobuild-YYYY-MM-DD-HH-MM tag to pin one
      FFMPEG_RELEASE: latest
      FFMPEG_ASSET_PATTERN: 'ffmpeg-n8.1*-win64-gpl-shared-8.1.zip'
      # 1.26.x is the last GStreamer series released as MSI
      GSTREAMER_VERSION: '1.26.11'
      # Plugins needed for audio playback (playbin, autoaudiosink, audiokaraoke, decoders and demuxers)
      GSTREAMER_PLUGINS: >-
        coreelements playback typefindfunctions pbtypes
        audioconvert audioresample volume audiofx audioparsers
        autodetect wasapi directsound
        id3demux apetag icydemux wavparse ogg vorbis opus opusparse flac mpg123
        isomp4 matroska asf libav
      # Libraries gstreamer-sharp binds to
      GSTREAMER_LIBS: >-
        libgstapp-1.0-0.dll libgstaudio-1.0-0.dll libgstbase-1.0-0.dll libgstcontroller-1.0-0.dll
        libgstfft-1.0-0.dll libgstnet-1.0-0.dll libgstpbutils-1.0-0.dll libgstriff-1.0-0.dll
        libgstrtp-1.0-0.dll libgstrtsp-1.0-0.dll libgstsdp-1.0-0.dll libgsttag-1.0-0.dll
        libgstvideo-1.0-0.dll
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: latest
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore NuGet packages
        run: nuget restore Vocaluxe.sln

      - name: Build solution
        env:
          VOCALUXE_VERSION: ${{ github.ref_name }}
        run: msbuild Vocaluxe.sln /p:Configuration=ReleaseWin /p:Platform="x64"

      - name: Download theme videos
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/Vocaluxe/VocaluxeDependencies/raw/master/zips/themes/vocaluxe.themes.vocaluxe-2024.video-part1.zip' -OutFile 'vocaluxe.themes.vocaluxe-2024.video.zip'
          7z x '-aoa' '-oOutput/' './vocaluxe.themes.vocaluxe-2024.video.zip'
          Remove-Item './vocaluxe.themes.vocaluxe-2024.video.zip'

      - name: Resolve FFmpeg build
        id: ffmpeg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api "repos/BtbN/FFmpeg-Builds/releases/tags/$env:FFMPEG_RELEASE" | ConvertFrom-Json
          $asset = $release.assets | Where-Object { $_.name -like $env:FFMPEG_ASSET_PATTERN } | Select-Object -First 1
          if (-not $asset) { throw "No asset matching '$env:FFMPEG_ASSET_PATTERN' in BtbN/FFmpeg-Builds release '$env:FFMPEG_RELEASE'" }
          Write-Host "Using $($asset.name)"
          "id=$($asset.id)" >> $env:GITHUB_OUTPUT
          "url=$($asset.browser_download_url)" >> $env:GITHUB_OUTPUT

      - name: Cache FFmpeg and GStreamer libs
        id: libs-cache
        uses: actions/cache@v6
        with:
          path: deps
          key: libs-ffmpeg-${{ steps.ffmpeg.outputs.id }}-gstreamer-${{ env.GSTREAMER_VERSION }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Download FFmpeg and GStreamer
        if: steps.libs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'libs'
          New-Item -ItemType Directory -Force -Path deps/ffmpeg, $tmp | Out-Null

          Invoke-WebRequest -Uri '${{ steps.ffmpeg.outputs.url }}' -OutFile "$tmp\ffmpeg.zip"
          7z x -y "-o$tmp\ffmpeg" "$tmp\ffmpeg.zip"
          Copy-Item "$tmp\ffmpeg\*\bin\*.dll" -Destination deps/ffmpeg

          $msiUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GSTREAMER_VERSION/mingw/gstreamer-1.0-mingw-x86_64-$env:GSTREAMER_VERSION.msi"
          $msi = Join-Path $tmp 'gstreamer.msi'
          $target = Join-Path $tmp 'gstreamer'
          Invoke-WebRequest -Uri $msiUrl -OutFile $msi
          $p = Start-Process msiexec.exe -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$target`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
          $gstRoot = (Get-ChildItem $target -Recurse -Filter 'libgstreamer-1.0-0.dll' | Select-Object -First 1).Directory.Parent
          if (-not $gstRoot) { throw "GStreamer runtime not found in extracted MSI" }
          "GST_ROOT=$($gstRoot.FullName)" >> $env:GITHUB_ENV

      - name: Trim GStreamer to required files
        if: steps.libs-cache.outputs.cache-hit != 'true'
        shell: python
        run: |
          # Copies the listed plugins, gst-plugin-scanner and the listed libraries together with all
          # DLLs they import (resolved recursively from the PE import tables) and strips debug info.
          import os, shutil, struct, subprocess

          src, dst = os.environ['GST_ROOT'], os.path.join('deps', 'gstreamer64')
          plugins = os.environ['GSTREAMER_PLUGINS'].split()
          libs = os.environ['GSTREAMER_LIBS'].split()

          def imports(path):
              with open(path, 'rb') as f:
                  data = f.read()
              pe = struct.unpack_from('<I', data, 0x3C)[0]
              sections, opt_size = struct.unpack_from('<H12xH', data, pe + 6)
              opt = pe + 24
              dirs = opt + (112 if struct.unpack_from('<H', data, opt)[0] == 0x20B else 96)
              import_rva = struct.unpack_from('<I', data, dirs + 8)[0]
              # VirtualSize, VirtualAddress, SizeOfRawData, PointerToRawData of each section
              table = [struct.unpack_from('<IIII', data, opt + opt_size + i * 40 + 8)
                       for i in range(sections)]

              def offset(rva):
                  for vsize, vaddr, rawsize, rawptr in table:
                      if vaddr <= rva < vaddr + max(vsize, rawsize):
                          return rva - vaddr + rawptr
                  raise ValueError(f'{path}: RVA {rva:#x} outside all sections')

              names, pos = [], offset(import_rva) if import_rva else None
              while pos is not None:
                  name_rva = struct.unpack_from('<I', data, pos + 12)[0]
                  if not name_rva:
                      break
                  start = offset(name_rva)
                  names.append(data[start:data.index(b'\0', start)].decode().lower())
                  pos += 20
              return names

          bin_dir = os.path.join(src, 'bin')
          available = {f.lower(): f for f in os.listdir(bin_dir)}
          roots = [os.path.join(src, 'lib', 'gstreamer-1.0', f'libgst{p}.dll') for p in plugins]
          roots.append(os.path.join(src, 'libexec', 'gstreamer-1.0', 'gst-plugin-scanner.exe'))
          roots += [os.path.join(bin_dir, available[l.lower()]) for l in libs]

          files, queue = set(), list(roots)
          while queue:
              path = queue.pop()
              if path in files:
                  continue
              files.add(path)
              queue += [os.path.join(bin_dir, available[d]) for d in imports(path) if d in available]

          strip = shutil.which('llvm-strip') or r'C:\Program Files\LLVM\bin\llvm-strip.exe'
          if not os.path.exists(strip):
              strip = None
              print('::warning::llvm-strip not found, GStreamer DLLs are copied with debug info')

          total = 0
          for path in sorted(files):
              target = os.path.join(dst, os.path.relpath(path, src))
              os.makedirs(os.path.dirname(target), exist_ok=True)
              # llvm-strip cannot handle every MinGW DLL (e.g. libstdc++), those are copied as they are
              if not strip or subprocess.run([strip, '--strip-debug', path, '-o', target]).returncode != 0:
                  shutil.copy2(path, target)
              total += os.path.getsize(target)
              print(os.path.relpath(target, dst))
          print(f'{len(files)} files, {total / 1e6:.1f} MB')

      - name: Copy FFmpeg and GStreamer libs to output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Output/libs/unmanaged | Out-Null
          Copy-Item deps/ffmpeg, deps/gstreamer64 -Destination Output/libs/unmanaged -Recurse -Force

      - name: Run tests
        shell: pwsh
        run: |
          nuget install NUnit.ConsoleRunner -Version 3.20.1 -OutputDirectory testrunner
          .\testrunner\NUnit.ConsoleRunner.3.20.1\tools\nunit3-console.exe ".\Tests\bin\Release\Tests.dll" --result=".\TestResult.xml"

      - name: Create release package name
        id: package
        shell: pwsh
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $filename = "Vocaluxe_CustomBuild_FFmpeg_$date.7z"
          "filename=$filename" >> $env:GITHUB_OUTPUT

      - name: Create 7Z package
        shell: pwsh
        run: |
          7z a "${{ steps.package.outputs.filename }}" ".\Output\*"

      - name: Upload release package artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-package
          path: ${{ steps.package.outputs.filename }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release package artifact
        uses: actions/download-artifact@v7
        with:
          name: release-package
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Vocaluxe Custom Build FFmpeg
          prerelease: false
          target_commitish: ${{ github.sha }}
          files: artifacts/*.7z
          fail_on_unmatched_files: true